<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="icon" href="./assets/icons/favicon.png" type="image/png">
    <link href="style.css" rel="stylesheet">
    <link href="./styles/typography.css" rel="stylesheet">
    <link href="./styles/pokemoncards.css" rel="stylesheet">
    <script src="./scripts/templates.js"></script>
</head>

<body onload="init()">
    <header>
        <div class="header-wrapper">
            <div class="headercicles">
                <div class="bigbluecircle"></div>
                <div class="littlecircles">
                    <div class="littleredcircle"></div>
                    <div class="littleyellowcircle"></div>
                    <div class="littlegreencircle"></div>
                </div>
            </div>
            <p class="headlinetext">Pokédex</p>
        </div>
        <div class="header-border">
            <div class="bordercircles">
                <div class="circleleft"></div>
                <div class="circleright"></div>
            </div>
        </div>
    </header>
    <main>
        <div class="main-wrapper">
            <div class="nav-bar">
                <div class="nav-bar-header">
                    <p class="headlinetext">Pokédex</p>
                    <p class="result">151 gefunden</p>
                </div>
                <div class="searchbar">
                    <p class="headlinetext">Search...</p>
                    <input type="text" id="name" name="name" placeholder="Name or Number...">
                </div>
                <div class="filter-buttons">
                    <button class="category-btn">All</button>
                    <button class="category-btn">Fire</button>
                    <button class="category-btn">Water</button>
                    <button class="category-btn">Elektro</button>
                    <button class="category-btn">Psycho</button>
                </div>
            </div>
            <div class="main-content" id="pokemoncards">
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-wrapper">
            <div class="circle-grid">
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
            </div>
            <div class="joystick">

            </div>
            <div class="buttons">
                <button class="last-btn" id="last-btn">L</button>
                <button class="next-btn" id="next-btn">N</button>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
