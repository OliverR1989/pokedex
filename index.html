<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="icon" href="./assets/icons/favicon.png" type="image/png">
    <link href="style.css" rel="stylesheet">
    <link href="./styles/typography.css" rel="stylesheet">
    <link href="./styles/pokemoncards.css" rel="stylesheet">
    <link href="./styles/pokemondetailcard.css" rel="stylesheet">
    <link href="./styles/types.css" rel="stylesheet">
    <link href="./styles/loading.css" rel="stylesheet">
    <script src="./scripts/templates.js"></script>
</head>

<body onload="init()">
    <header>
        <div class="header-wrapper">
            <div class="headercicles">
                <div class="bigbluecircle"></div>
                <div class="littlecircles">
                    <div class="littleredcircle"></div>
                    <div class="littleyellowcircle"></div>
                    <div class="littlegreencircle"></div>
                </div>
            </div>
            <p class="headlinetext">Pokédex</p>
        </div>
        <div class="header-border">
            <div class="bordercircles">
                <div class="circleleft"></div>
                <div class="circleright"></div>
            </div>
        </div>
    </header>
    <main>
        <div class="main-wrapper">
            <div class="nav-bar">
                <div class="nav-bar-header">
                    <p class="result" id="catchedPokemonResult"></p>
                </div>
                <div class="searchbar">
                    <p class="headlinetext">Search...</p>
                    <input oninput="searchPokemon()" type="text" id="pokemonName" name="name" placeholder="Name...">
                </div>
            </div>
            <div class="main-content" id="pokemoncards">
            </div>
        </div>
        <div class="loading-screen d-none" id="loadingScreen" role="status">
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading Pokémon...</p>
        </div> 
    </main>
    <footer>
        <div class="footer-wrapper">
            <div class="circle-grid">
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
                <div class="footercircle"></div>
            </div>
            <div class="load-more" id="loadMore">
                <button class="load-more-btn" id="loadMoreBtn" onclick="fetchMorePokemon()">catch more Pokemon</button>
            </div>
        </div>
    </footer>
    <dialog class="pokemondetailcard-modal" id="modal" onclick="closeOnBackdropClick(event)"></dialog>
    <script src="script.js"></script>
</body>

</html>
